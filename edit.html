<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
</head>

<body>
    <h2>Update Student</h2>

    <form action="/students/edit/{{ std[0] }}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ std[1] }}" required><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="{{ std[2] }}" min="18" max="30" required><br>

        <label for="gender">Gender:</label>
        <input type="text" id="gender" name="gender" value="{{ std[3] }}" required><br>

        <label for="marks">Marks:</label>
        <input type="number" id="marks" name="marks" value="{{ std[4] }}" min="0" max="100" required><br>

        <label for="course">Course:</label>
        <input type="text" id="course" name="course" value="{{ std[5] }}" required><br>

        <label for="image">Image URL:</label>
        <input type="url" id="image" name="image" value="{{ std[6] or '' }}"><br>

        <label for="status">Attendance:</label>
        <select id="status" name="status" required>
            <option value="1" {% if std[7]==1 %}selected{% endif %}>
                Present
            </option>
            <option value="0" {% if std[7]==0 %}selected{% endif %}>
                Absent
            </option>
        </select><br>

        <button type="submit">Save Changes</button>
    </form>

    <a href="/">Back to students</a>
</body>

</html>
